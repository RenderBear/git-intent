<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Domains and contracts in git-intent</title>
  <desc id="desc">Three semantic domains connected by contracts, governed by an architectural constraint, and grounded in design material.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38d9ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bridgeOne" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d9ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bridgeTwo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="598" rx="30" fill="url(#background)" stroke="#334155" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="598" rx="30" fill="url(#grid)"/>
  <circle cx="180" cy="210" r="120" fill="#0891b2" fill-opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="600" cy="250" r="160" fill="#7c3aed" fill-opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1030" cy="210" r="120" fill="#f59e0b" fill-opacity="0.07" filter="url(#softGlow)"/>

  <text x="600" y="52" text-anchor="middle" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3">SEMANTIC GOVERNANCE</text>
  <text x="600" y="91" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Give architecture a memory.</text>
  <text x="600" y="120" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Responsibility lives in domains. Reliance lives at their seams.</text>

  <!-- Contract bridges sit behind the domain cards. -->
  <path d="M 320 280 C 370 245, 420 245, 470 280" fill="none" stroke="url(#bridgeOne)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 730 280 C 780 245, 830 245, 880 280" fill="none" stroke="url(#bridgeTwo)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="395" cy="255" r="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
  <circle cx="805" cy="255" r="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="60" y="168" width="260" height="218" rx="22" fill="#111c31" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="470" y="168" width="260" height="218" rx="22" fill="#17152f" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="880" y="168" width="260" height="218" rx="22" fill="#221a20" stroke="#fbbf24" stroke-opacity="0.72" stroke-width="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="84" y="194" width="82" height="27" rx="13.5" fill="url(#cyan)"/>
    <text x="125" y="212" text-anchor="middle" fill="#06111f" font-size="11" font-weight="800" letter-spacing="1.4">DOMAIN</text>
    <text x="84" y="263" fill="#f8fafc" font-size="25" font-weight="700">Product surface</text>
    <text x="84" y="293" fill="#94a3b8" font-size="14">Owns user-facing behavior</text>
    <line x1="84" y1="326" x2="296" y2="326" stroke="#38bdf8" stroke-opacity="0.2"/>
    <circle cx="94" cy="352" r="4" fill="#22d3ee"/>
    <text x="108" y="357" fill="#cbd5e1" font-size="13">changes coherently</text>

    <rect x="494" y="194" width="82" height="27" rx="13.5" fill="url(#violet)"/>
    <text x="535" y="212" text-anchor="middle" fill="#150724" font-size="11" font-weight="800" letter-spacing="1.4">DOMAIN</text>
    <text x="494" y="263" fill="#f8fafc" font-size="25" font-weight="700">Coordination</text>
    <text x="494" y="293" fill="#a8a3c2" font-size="14">Selects and directs work</text>
    <line x1="494" y1="326" x2="706" y2="326" stroke="#a78bfa" stroke-opacity="0.22"/>
    <circle cx="504" cy="352" r="4" fill="#c084fc"/>
    <text x="518" y="357" fill="#d8d3e8" font-size="13">holds its own intent</text>

    <rect x="904" y="194" width="82" height="27" rx="13.5" fill="url(#amber)"/>
    <text x="945" y="212" text-anchor="middle" fill="#241004" font-size="11" font-weight="800" letter-spacing="1.4">DOMAIN</text>
    <text x="904" y="263" fill="#f8fafc" font-size="25" font-weight="700">Execution</text>
    <text x="904" y="293" fill="#b8aaa0" font-size="14">Performs specialized work</text>
    <line x1="904" y1="326" x2="1116" y2="326" stroke="#fbbf24" stroke-opacity="0.2"/>
    <circle cx="914" cy="352" r="4" fill="#fbbf24"/>
    <text x="928" y="357" fill="#ded2c8" font-size="13">evolves independently</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="342" y="229" width="106" height="47" rx="15" fill="#10182b" stroke="#7dd3fc" stroke-opacity="0.65"/>
    <text x="395" y="248" text-anchor="middle" fill="#e0f2fe" font-size="10" font-weight="800" letter-spacing="1.2">CONTRACT</text>
    <text x="395" y="264" text-anchor="middle" fill="#94a3b8" font-size="10">event · API</text>
    <rect x="752" y="229" width="106" height="47" rx="15" fill="#171629" stroke="#d8b4fe" stroke-opacity="0.65"/>
    <text x="805" y="248" text-anchor="middle" fill="#f3e8ff" font-size="10" font-weight="800" letter-spacing="1.2">CONTRACT</text>
    <text x="805" y="264" text-anchor="middle" fill="#a8a3b2" font-size="10">job · schema</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="160" y="422" width="880" height="62" rx="19" fill="#0f172a" fill-opacity="0.88" stroke="#64748b" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 7"/>
    <rect x="184" y="439" width="104" height="28" rx="14" fill="#25324a"/>
    <text x="236" y="458" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="800" letter-spacing="1.2">CONSTRAINT</text>
    <text x="312" y="458" fill="#e2e8f0" font-size="14" font-weight="600">Accepted limits preserve the permitted architectural shape.</text>

    <text x="600" y="530" text-anchor="middle" fill="#64748b" font-size="10" font-weight="800" letter-spacing="1.8">GROUNDED IN ARCHITECTURAL MATERIAL</text>
    <rect x="357" y="548" width="104" height="28" rx="14" fill="#172033" stroke="#334155"/>
    <rect x="471" y="548" width="104" height="28" rx="14" fill="#172033" stroke="#334155"/>
    <rect x="585" y="548" width="104" height="28" rx="14" fill="#172033" stroke="#334155"/>
    <rect x="699" y="548" width="144" height="28" rx="14" fill="#172033" stroke="#334155"/>
    <text x="409" y="566" text-anchor="middle" fill="#94a3b8" font-size="11">ADRs</text>
    <text x="523" y="566" text-anchor="middle" fill="#94a3b8" font-size="11">Diagrams</text>
    <text x="637" y="566" text-anchor="middle" fill="#94a3b8" font-size="11">Schemas</text>
    <text x="771" y="566" text-anchor="middle" fill="#94a3b8" font-size="11">Design docs</text>
  </g>
</svg>
