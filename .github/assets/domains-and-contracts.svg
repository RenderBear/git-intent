<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Durable governance and temporary planning</title>
  <desc id="desc">Accepted governance and short-lived planning remain separate, then meet at prospective landing before Git integration.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08101f"/>
      <stop offset="0.52" stop-color="#10182d"/>
      <stop offset="1" stop-color="#081423"/>
    </linearGradient>
    <linearGradient id="governance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="planning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="landing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#020617" flood-opacity="0.52"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="698" rx="30" fill="url(#background)" stroke="#334155" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="698" rx="30" fill="url(#grid)"/>
  <circle cx="220" cy="270" r="150" fill="#0891b2" fill-opacity="0.07" filter="url(#glow)"/>
  <circle cx="980" cy="270" r="150" fill="#10b981" fill-opacity="0.055" filter="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="48" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="750" letter-spacing="2.8">ONE REPOSITORY · TWO LIFETIMES</text>
    <text x="600" y="88" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="750">Durable intent. Temporary coordination.</text>
    <text x="600" y="119" text-anchor="middle" fill="#94a3b8" font-size="15">Governance says what must remain true. Planning says who is doing what now.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="153" width="510" height="370" rx="24" fill="#101a30" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="2"/>
    <rect x="635" y="153" width="510" height="370" rx="24" fill="#131d2b" stroke="#34d399" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="79" y="177" width="245" height="27" rx="13.5" fill="url(#governance)"/>
    <text x="201.5" y="195" text-anchor="middle" fill="#07111f" font-size="9.5" font-weight="850" letter-spacing="1.2">TRACKED · DURABLE · ACCEPTED</text>
    <text x="79" y="245" fill="#f8fafc" font-size="28" font-weight="760">Governance</text>
    <text x="79" y="270" fill="#9fb0c8" font-size="14">Sparse meaning future work must preserve</text>

    <rect x="79" y="294" width="142" height="104" rx="16" fill="#0d2335" stroke="#22d3ee" stroke-opacity="0.42"/>
    <rect x="239" y="294" width="142" height="104" rx="16" fill="#17203b" stroke="#818cf8" stroke-opacity="0.45"/>
    <rect x="399" y="294" width="142" height="104" rx="16" fill="#211a3a" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="96" y="323" fill="#67e8f9" font-size="11" font-weight="800" letter-spacing="1.1">DOMAINS</text>
    <text x="96" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Responsibility</text>
    <text x="96" y="371" fill="#8495ad" font-size="12">stable identity</text>
    <text x="256" y="323" fill="#a5b4fc" font-size="11" font-weight="800" letter-spacing="1.1">CONTRACTS</text>
    <text x="256" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Relied-on promises</text>
    <text x="256" y="371" fill="#8f98b1" font-size="12">with verification</text>
    <text x="416" y="323" fill="#c4b5fd" font-size="11" font-weight="800" letter-spacing="1.1">CONSTRAINTS</text>
    <text x="416" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Permitted shape</text>
    <text x="416" y="371" fill="#9d94b2" font-size="12">semantic limits</text>

    <rect x="79" y="423" width="462" height="74" rx="16" fill="#0d1729" stroke="#64748b" stroke-opacity="0.42" stroke-dasharray="6 6"/>
    <text x="99" y="450" fill="#cbd5e1" font-size="11" font-weight="800" letter-spacing="1.1">EVIDENCE CAN PROPOSE, NEVER BIND</text>
    <text x="99" y="475" fill="#8290a5" font-size="12">Audits &amp; observations · grounded in ADRs, schemas, and design material</text>

    <rect x="659" y="177" width="245" height="27" rx="13.5" fill="url(#planning)"/>
    <text x="781.5" y="195" text-anchor="middle" fill="#10150b" font-size="9.5" font-weight="850" letter-spacing="1.2">IGNORED · LOCAL · SHORT-LIVED</text>
    <text x="659" y="245" fill="#f8fafc" font-size="28" font-weight="760">Planning</text>
    <text x="659" y="270" fill="#a3b5ab" font-size="14">Current coordination, never repository meaning</text>

    <rect x="659" y="294" width="142" height="104" rx="16" fill="#26251c" stroke="#fbbf24" stroke-opacity="0.42"/>
    <rect x="819" y="294" width="142" height="104" rx="16" fill="#172a27" stroke="#6ee7b7" stroke-opacity="0.42"/>
    <rect x="979" y="294" width="142" height="104" rx="16" fill="#122a2a" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text x="676" y="323" fill="#fde68a" font-size="11" font-weight="800" letter-spacing="1.1">PLANS</text>
    <text x="676" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Dependency graph</text>
    <text x="676" y="371" fill="#a39d82" font-size="12">work units</text>
    <text x="836" y="323" fill="#a7f3d0" font-size="11" font-weight="800" letter-spacing="1.1">CLAIMS</text>
    <text x="836" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Collision bounds</text>
    <text x="836" y="371" fill="#89a59b" font-size="12">paths · interfaces</text>
    <text x="996" y="323" fill="#99f6e4" font-size="11" font-weight="800" letter-spacing="1.1">LEASES</text>
    <text x="996" y="348" fill="#e2e8f0" font-size="14" font-weight="650">Causal ownership</text>
    <text x="996" y="371" fill="#85a5a3" font-size="12">branch · ground</text>

    <rect x="659" y="423" width="462" height="74" rx="16" fill="#101d25" stroke="#64748b" stroke-opacity="0.38" stroke-dasharray="6 6"/>
    <text x="679" y="450" fill="#cbd5e1" font-size="11" font-weight="800" letter-spacing="1.1">DISSOLVES AFTER CONVERGENCE</text>
    <text x="679" y="475" fill="#839c96" font-size="12">Released after landing · safe to delete without changing intent</text>
  </g>

  <path d="M 310 523 C 310 544, 390 545, 450 561" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 890 523 C 890 544, 810 545, 750 561" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="205" y="559" width="790" height="84" rx="22" fill="url(#landing)" fill-opacity="0.76" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="229" y="578" width="165" height="27" rx="13.5" fill="#e0e7ff"/>
    <text x="311.5" y="596" text-anchor="middle" fill="#1e1b4b" font-size="10" font-weight="850" letter-spacing="1.2">PROSPECTIVE LANDING</text>
    <text x="229" y="626" fill="#dbeafe" font-size="13">Exact candidate · verify promises · review limits · authenticate leases</text>
    <line x1="703" y1="576" x2="703" y2="626" stroke="#cbd5e1" stroke-opacity="0.28"/>
    <path d="M 728 601 L 770 601" stroke="#d1fae5" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="786" y="577" width="181" height="49" rx="15" fill="#0b1d22" stroke="#6ee7b7" stroke-opacity="0.62"/>
    <text x="876.5" y="597" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="800" letter-spacing="1.1">INTEGRATION BRANCH</text>
    <text x="876.5" y="615" text-anchor="middle" fill="#94a3b8" font-size="11">atomic ref update</text>

    <text x="600" y="676" text-anchor="middle" fill="#64748b" font-size="11" font-weight="800" letter-spacing="1.8">GIT IS THE CAUSAL CLOCK AND IMPLEMENTATION TRUTH</text>
  </g>
</svg>
