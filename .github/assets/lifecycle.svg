<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Invariant's Git-grounded lifecycle and durable semantic layer</title>
  <desc id="desc">A user goal moves through work coordination, execution, verification, and local landing. Conflicts return to an agent or human for resolution. Below the lifecycle, domains point to architecture files and contracts point to contract files.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7f8a9a"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#70cc99"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#62c5dc"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="16" fill="#0d1117"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Git-grounded lifecycle -->
    <rect x="24" y="24" width="1152" height="264" rx="14" fill="#11161e" stroke="#2d3643" stroke-width="1.5"/>

    <g transform="translate(48 47)" fill="none" stroke="#8d98a8" stroke-width="1.7" stroke-linecap="round">
      <circle cx="4" cy="0" r="3"/>
      <circle cx="4" cy="13" r="3"/>
      <circle cx="17" cy="13" r="3"/>
      <path d="M 4 3 L 4 10 M 7 13 L 14 13 M 4 7 C 4 12, 9 13, 14 13"/>
    </g>
    <text x="76" y="54" fill="#9aa5b4" font-size="10.5" font-weight="700" letter-spacing="1.45">GIT-GROUNDED LIFECYCLE</text>
    <text x="264" y="54" fill="#697586" font-size="10.5">isolated branch · exact candidate · atomic local integration</text>

    <!-- Stage labels -->
    <text x="100" y="91" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="650">User goal</text>
    <text x="320" y="91" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="650">Coordinate work</text>
    <text x="535" y="91" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="650">Execute</text>
    <text x="760" y="91" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="650">Verify</text>
    <text x="1070" y="91" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="650">Land locally</text>

    <!-- User goal: target icon -->
    <g transform="translate(100 129)" fill="none" stroke="#c3cad3" stroke-width="1.8">
      <circle r="20"/>
      <circle r="11"/>
      <circle r="3" fill="#c3cad3" stroke="none"/>
    </g>

    <!-- Coordination: connected nodes icon -->
    <g transform="translate(320 129)" fill="none" stroke="#62c5dc" stroke-width="1.8" stroke-linecap="round">
      <path d="M 0 -1 L -15 -12 M 0 -1 L 15 -12 M 0 -1 L 0 17"/>
      <circle cy="-1" r="5" fill="#14242b"/>
      <circle cx="-17" cy="-14" r="4"/>
      <circle cx="17" cy="-14" r="4"/>
      <circle cy="20" r="4"/>
    </g>

    <!-- Execute: code icon -->
    <g transform="translate(535 129)" fill="none" stroke="#c3cad3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -10 -12 L -21 0 L -10 12 M 10 -12 L 21 0 L 10 12 M 4 -17 L -4 17"/>
    </g>

    <!-- Verify: shield and check icon -->
    <g transform="translate(760 129)" fill="none" stroke="#70cc99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -21 L 19 -14 V -1 C 19 12, 11 20, 0 25 C -11 20, -19 12, -19 -1 V -14 Z"/>
      <path d="M -8 1 L -2 7 L 9 -6" stroke-width="2.2"/>
    </g>

    <!-- Land: Git branch and check icon -->
    <g transform="translate(1070 129)" fill="none" stroke="#70cc99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-12" cy="-16" r="4"/>
      <circle cx="-12" cy="17" r="4"/>
      <path d="M -12 -12 V 13 M -8 -7 C 5 -7, 4 7, 14 7"/>
      <circle cx="17" cy="7" r="11" fill="#14251d"/>
      <path d="M 11 7 L 15 11 L 23 2" stroke-width="2"/>
    </g>

    <!-- Single-line flow -->
    <path d="M 126 129 L 287 129" fill="none" stroke="#7f8a9a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M 345 129 L 504 129" fill="none" stroke="#7f8a9a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M 562 129 L 729 129" fill="none" stroke="#7f8a9a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M 785 129 L 1037 129" fill="none" stroke="#70cc99" stroke-width="1.9" marker-end="url(#arrow-green)"/>
    <text x="911" y="120" text-anchor="middle" fill="#70cc99" font-size="9.5">passes</text>

    <text x="100" y="169" text-anchor="middle" fill="#727d8d" font-size="10.5">requested behavior</text>
    <text x="320" y="169" text-anchor="middle" fill="#727d8d" font-size="10.5">scope · dependencies</text>
    <text x="535" y="169" text-anchor="middle" fill="#727d8d" font-size="10.5">isolated work</text>
    <text x="760" y="169" text-anchor="middle" fill="#727d8d" font-size="10.5">contracts · architecture</text>
    <text x="1070" y="169" text-anchor="middle" fill="#70b889" font-size="10.5">only on success</text>

    <!-- Conflict resolution: agent or human -->
    <path d="M 850 129 L 850 202" fill="none" stroke="#9b7b4c" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="862" y="190" fill="#b18b53" font-size="9.5">conflict or ambiguity</text>

    <rect x="640" y="210" width="350" height="59" rx="12" fill="#1b1813" stroke="#685634"/>
    <!-- Agent icon -->
    <g transform="translate(667 237)" fill="none" stroke="#d7b06d" stroke-width="1.4" stroke-linecap="round">
      <rect x="-10" y="-9" width="20" height="18" rx="4"/>
      <path d="M 0 -9 V -14 M -4 -14 H 4"/>
      <circle cx="-4" cy="0" r="1.5" fill="#d7b06d" stroke="none"/>
      <circle cx="4" cy="0" r="1.5" fill="#d7b06d" stroke="none"/>
    </g>
    <!-- Human icon -->
    <g transform="translate(702 237)" fill="none" stroke="#d7b06d" stroke-width="1.4" stroke-linecap="round">
      <circle cy="-7" r="6"/>
      <path d="M -10 10 C -9 2, 9 2, 10 10"/>
    </g>
    <text x="728" y="232" fill="#e6e0d5" font-size="12.5" font-weight="650">Resolve conflict</text>
    <text x="728" y="251" fill="#9d917d" font-size="10.5">agent within authority · human when meaning changes</text>

    <path d="M 640 239 C 600 239, 535 230, 535 157" fill="none" stroke="#9b7b4c" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

    <!-- Durable semantic layer -->
    <rect x="24" y="312" width="1152" height="124" rx="14" fill="#101d24" stroke="#315566" stroke-width="1.5"/>
    <text x="52" y="342" fill="#6dcede" font-size="10.5" font-weight="700" letter-spacing="1.45">DURABLE SEMANTIC LAYER</text>
    <text x="241" y="342" fill="#71808d" font-size="10.5">repository knowledge that remains after the work ends</text>

    <path d="M 320 312 L 320 294" fill="none" stroke="#62c5dc" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
    <text x="331" y="304" fill="#62c5dc" font-size="9.5">guides coordination</text>
    <path d="M 760 312 L 760 294" fill="none" stroke="#70cc99" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <text x="771" y="304" fill="#70cc99" font-size="9.5">grounds verification</text>

    <!-- Domains to architecture files -->
    <g transform="translate(66 388)" fill="none" stroke="#62c5dc" stroke-width="1.5">
      <rect x="-12" y="-12" width="10" height="10" rx="2"/>
      <rect x="3" y="-12" width="10" height="10" rx="2"/>
      <rect x="-12" y="3" width="10" height="10" rx="2"/>
      <rect x="3" y="3" width="10" height="10" rx="2"/>
    </g>
    <text x="92" y="393" fill="#e5e9ee" font-size="14" font-weight="650">Domains</text>
    <path d="M 167 388 L 217 388" fill="none" stroke="#657486" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(239 388)" fill="none" stroke="#a8b2bf" stroke-width="1.5" stroke-linejoin="round">
      <path d="M -10 -15 H 5 L 12 -8 V 15 H -10 Z"/>
      <path d="M 5 -15 V -8 H 12 M -4 -2 H 6 M -4 4 H 6"/>
    </g>
    <text x="263" y="393" fill="#d7dde5" font-size="13.5">Architecture files</text>

    <!-- Contracts to contract files -->
    <g transform="translate(626 388)" fill="none" stroke="#70cc99" stroke-width="1.6" stroke-linecap="round">
      <path d="M -15 5 C -21 -1, -21 -8, -16 -13 C -11 -18, -4 -18, 2 -12 L 7 -7 M 15 -5 C 21 1, 21 8, 16 13 C 11 18, 4 18, -2 12 L -7 7 M -7 7 L 7 -7"/>
    </g>
    <text x="654" y="393" fill="#e5e9ee" font-size="14" font-weight="650">Contracts</text>
    <path d="M 735 388 L 785 388" fill="none" stroke="#657486" stroke-width="1.6" marker-end="url(#arrow)"/>
    <g transform="translate(808 388)" fill="none" stroke="#a8b2bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -10 -15 H 5 L 12 -8 V 15 H -10 Z"/>
      <path d="M 5 -15 V -8 H 12 M -5 4 L -1 8 L 7 -2"/>
    </g>
    <text x="833" y="393" fill="#d7dde5" font-size="13.5">Contract files</text>
  </g>
</svg>
